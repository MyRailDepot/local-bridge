name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'MyRailDepot/local-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      # pnpm's OIDC trusted-publishing support is unreliable (broken again on pnpm 11 as of
      # this writing), so publish with npm directly; pnpm is still used for everything else.
      - run: npm install -g npm@latest
      - run: npm publish --access public
